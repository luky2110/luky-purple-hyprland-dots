####################
### Startup Apps ###
####################

#Change the Cursor theme here
exec-once = hyprctl setcursor Bibata-Modern-Ice 24

exec-once = waybar
exec-once = hyprpaper

#################
### Variables ###
#################

# This sets up variables to shorten the name
# Usage:
# $name = command

#If you use different programs just replace them with the binary name
$terminal 	= alacritty
$browser 	= zen-browser 
$files      = thunar
$appmenu    = wofi --show drun
$mod 	  	= SUPER
$screenshot = hyprshot -m region -o ~/Pictures/Screenshots

###############################
### Environnement Variables ###
###############################

# Remove the # of the two following lines if you use NVIDIA
#env = __GLX_VENDOR_LIBRARY_NAME,nvidia
#env = GBM_BACKEND,nvidia-drm

# Run electron apps in wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto

#Fix for QT on wayland
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

#####################
### Monitor Setup ###
#####################

# This allows you to setup a screen as you desire (Resolution/Refresh Rate/Position/Screen Scaling)
# Usage:
# monitor="name","length"x"height"@"rate","Position1"x"Position2","scale"
# To find out the name and capabilities of your display type ´hyprctl monitors´ into your terminal
# If more help is needed visit my YouTube or github linked at the top of the file

monitor = 

#Here are real world examples of my screens

#PC (Dual Screen setup 1440p right, 1080 left)
#monitor = DP-1,		2560x1440@180,	0x0,	auto
#monitor = HDMI-A-1,	1920x1080@240,	2560x0,	auto

#Laptop
#monitor = eDP-1,	1920x1080@144,	0x0,	auto

###################
### Keybindings ###
###################

# This allows you to add keybindings to a certain command
# Usage:
# bind = "key", "key", hyprctl-command, command

bind = $mod, Q,        killactive,
bind = $mod, B,        exec,           $browser
bind = $mod, RETURN,   exec,           $terminal
bind = $mod, TAB,      togglefloating,
bind = $mod, SPACE,    exec,           $appmenu
bind = $mod, E,        exec,           $files
bind = $mod, F,        fullscreen,
bind = $mod, S,        exec,           $screenshot
bind = ,     PRINT,    exec,           $screenshot
bind = $mod SHIFT, E,  exit

# Move focus (Vim-like)
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

# Move focus (Arrow Keys)
bind = $mod, left,  movefocus, l
bind = $mod, down,  movefocus, d
bind = $mod, up,    movefocus, u
bind = $mod, right, movefocus, r

# Switch workspace
bind = $mod, 1, workspace,  1
bind = $mod, 2, workspace,  2
bind = $mod, 3, workspace,  3
bind = $mod, 4, workspace,  4
bind = $mod, 5, workspace,  5
bind = $mod, 6, workspace,  6
bind = $mod, 7, workspace,  7
bind = $mod, 8, workspace,  8
bind = $mod, 9, workspace,  9
bind = $mod, 0, workspace, 10

# Switch workspace with app
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace,10

# Move workspace with mousewheel

bind = $mod, mouse_down , workspace, e+1
bind = $mod, mouse_up,    workspace, e-1

# Resize & drag windows with mouse buttons

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizeactive

# Change volume with standart volume keys
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, 	    exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, 	exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Change screen brightness (using brightnessctl)
bindel = ,XF86MonBrightnessUp, 	 exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
    #Depending on what display you have you will have to use this
    #I do not know how it works I only know it sets the two of my screens brightness to either 75 or 0 depending on what shortcut I use
    #If you need it like this and it does not work for you just ask an AI and say "It's for screenbrigthness in hyprland, how do I make this work for my setup" and paste the four following lines too
bind = $mod, Page_Up,  exec,           ddcutil --bus=7 setvcp 10 75
bind = $mod, Page_Up,  exec,           ddcutil --bus=8 setvcp 10 75
bind = $mod, Page_Down,exec,           ddcutil --bus=7 setvcp 10 0
bind = $mod, Page_Down,exec,           ddcutil --bus=8 setvcp 10 0

# Media keys (using playerctl)
bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioPrev,  exec, playerctl previous

#############
### Input ###
#############

input {
    kb_layout =
#Example
#    kb_layout = us
    kb_variant =
#Example (Adds characters to your layout, good if you need international characters not included in your layout)
#    kb_variant = altgr-intl
    kb_model =
    kb_options =
#Example (Switches ALT and LALT, important if you dont need ALT but LALT)
#    kb_options = lv3:lalt_switch
    kb_rules =

    follow_mouse = 1

    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

gesture = 3, horizontal, workspace

# Per device config example
#  device {
#     name = epic-mouse-v1
#     sensitivity = -0.5
# }

##############
### Design ###
##############

general {
  gaps_in = 6
  gaps_out = 20
  border_size = 2

  col.active_border 	= rgba(153,51,255,1) rgba(128,0,128,1) rgba(255,51,255,1) 45deg
  col.inactive_border 	= rgba(51,0,51,1)

  resize_on_border = false

  allow_tearing = false

  layout = dwindle

}

decoration {
  rounding = 		2
  rounding_power = 	10

  active_opacity    = 0.85
  inactive_opacity  = 0.80

  blur {
    enabled = true
    size = 	5
    passes = 	2

    vibrancy = 0.1696

  }
}

animations {
    enabled = yes

# Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
#            NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

# Default animations, see https://wiki.hypr.land/Configuring/Animations/
#               NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     1.79,  easeOutQuint
    animation = windowsIn,     1,     3.1,   easeOutQuint, popin 0%
    animation = windowsOut,    1,     0.80,  linear,       popin 0%
#    animation = fadeIn,        1,     1.73,  almostLinear
#    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     1.53,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     3.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}
